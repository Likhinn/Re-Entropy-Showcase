<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1118" />
  <title>Re-Entropy | Interactive 3D View</title>
  <meta name="description" content="Explore the Re-Entropy robot in 3D, subsystem by subsystem." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32'/%3E%3Cpath d='M10 27V6h8a6 6 0 0 1 0 12h-8m7 0 6 9' stroke='%234ade80' stroke-width='4' fill='none'/%3E%3C/svg%3E" />
</head>
<body data-view="loading">
  <section class="hero" aria-label="Introduction">
    <p class="corner tl">System<br />online</p>
    <p class="corner tr">3D<br />interact</p>
    <h1><span>RE-ENTROPY</span></h1>
  </section>

  <canvas id="stage" aria-label="3D model of the Re-Entropy robot. Drag to rotate."></canvas>
  <div id="spots"></div>

  <section class="hero front">
    <p class="lede">Explore subsystems. Isolate<br />assemblies. See the full robot.</p>
    <div class="robots" id="robots" role="group" aria-label="Choose a robot"></div>
    <button class="cta" id="launch" type="button">Launch Interactive View</button>
  </section>

  <aside class="panel" id="panel" aria-label="Subsystems" inert>
    <h2><span class="ln"><i id="pname">Re-Entropy:</i></span><span class="ln"><i id="prole">Off-season Competition Robot</i></span></h2>
    <ol id="list"></ol>
  </aside>
  <button class="round close" id="close" type="button" aria-label="Close interactive view" inert>
    <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
  </button>
  <p class="brand">Re-Entropy</p>
  <div class="tools" inert>
  <button class="round" id="zoomout" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
  <button class="explode" id="explode" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9 3 3m0 5V3h5m7 6 6-6m-5 0h5v5M9 15l-6 6m0-5v5h5m7-6 6 6m-5 0h5v-5" /></svg><span>Explode</span>
  </button>
  <button class="round" id="zoomin" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></svg></button>
  </div>
  <nav class="arrows" aria-label="Step through subsystems" inert>
    <button class="round" id="prev" type="button" aria-label="Previous subsystem"><svg viewBox="0 0 24 24"><path d="M20 12H4m6.5-6.5L4 12l6.5 6.5" /></svg></button>
    <button class="round" id="next" type="button" aria-label="Next subsystem"><svg viewBox="0 0 24 24"><path d="M4 12h16m-6.5-6.5L20 12l-6.5 6.5" /></svg></button>
  </nav>

  <div class="loader" id="loader" role="status"><span>Loading model</span><b id="pct">0</b></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
