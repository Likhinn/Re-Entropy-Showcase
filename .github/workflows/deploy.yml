name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # a fresh upload can take a moment to appear in the API that deploy-pages reads
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq .total_count || echo 0)
            echo "attempt $i: $n artifact(s)"
            if [ "${n:-0}" -ge 1 ]; then sleep 5; exit 0; fi
            sleep 5
          done
          echo "::error::the github-pages artifact never appeared"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
